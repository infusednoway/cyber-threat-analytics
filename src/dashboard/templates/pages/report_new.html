{% extends "base.html" %}
{% block title %}Новый отчёт{% endblock %}
{% block page_title %}Создание отчёта{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-7">
    <div class="card">
      <div class="card-header">Параметры отчёта</div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Название отчёта *</label>
            <input type="text" name="title" class="form-control" required
                   placeholder="Еженедельный отчёт по угрозам"/>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label">Период от</label>
              <input type="date" name="date_from" class="form-control"/>
            </div>
            <div class="col-6">
              <label class="form-label">Период до</label>
              <input type="date" name="date_to" class="form-control"/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Примечания</label>
            <textarea name="notes" class="form-control" rows="4"
                      placeholder="Дополнительные комментарии к отчёту..."></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сформировать отчёт</button>
            <a href="/reports" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
